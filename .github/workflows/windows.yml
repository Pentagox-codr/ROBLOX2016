name: Build Roblox 2016

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Boost
        shell: cmd
        run: |
          cd Library\boost
          call bootstrap.bat
          call build_boost.bat
        env:
          BOOST_ROOT: ${{ github.workspace }}\Library\boost

      - name: Configure and Build Qt (Partial)
        shell: cmd
        run: |
          :: Initialize the v140 (VS2015) compiler environment from the VS2019 runner
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          
          cd Library\Qt
          :: Using %CD% to dynamically set the path for the runner environment
          configure -make nmake -platform win32-msvc2015 -prefix "%CD%" -opensource -confirm-license -opengl desktop -nomake examples -nomake tests -webkit -xmlpatterns
          
          :: Start nmake; ignore expected break as per project instructions
          nmake || echo Qt build finished with expected partial completion.

      - name: Build Roblox Solution
        shell: cmd
        run: |
          :: Build the solution using the v140 toolset
          msbuild Roblox.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v140

      - name: Upload Artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-2016-Build
          path: |
            bin/*.exe
            bin/*.dll
            Library/Qt/lib/*.lib
